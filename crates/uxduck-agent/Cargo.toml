[package]
license = "Apache-2.0"
name = "uxduck-agent"
description = "Host-agnostic agent loop, provider trait and tools generated from contracts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
uxduck-contracts.workspace = true
futures.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest = { workspace = true, optional = true, features = ["stream"] }
eventsource-stream = { workspace = true, optional = true }

[features]
default = ["http"]
# The OpenAI Responses and Anthropic Messages providers over HTTP. Off in
# hosts that bring their own transport (the cloud host on Workers, S16).
http = ["dep:reqwest", "dep:eventsource-stream"]
# The names these had before they shared one HTTP client.
openai = ["http"]
anthropic = ["http"]

[dev-dependencies]
axum.workspace = true
tokio.workspace = true

[lints]
workspace = true
