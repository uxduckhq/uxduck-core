[package]
license = "Apache-2.0"
name = "uxduck"
description = "UXDuck ground control: the desktop app, daemon and command line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
uxduck-core.workspace = true
uxduck-contracts.workspace = true
uxduck-engine.workspace = true
# Terrain heights (S23): the files the engine's cache asks for.
uxduck-terrain.workspace = true
uxduck-media.workspace = true
md-5.workspace = true
base64.workspace = true
# Pictures attached to a chat, shown to the AI model as JPEGs (FB-248).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
jiff.workspace = true
uxduck-mavlink = { workspace = true, features = ["native", "named"] }
uxduck-agent = { workspace = true, features = ["http"] }
clap.workspace = true
axum.workspace = true
directories.workspace = true
flate2.workspace = true
# A flight as one file (ADR-0062): each file's checksum in the zip.
crc32fast.workspace = true
# Flights kept in the account (S82): tlog chunks compressed before upload.
zstd.workspace = true
# Interface archives (S109).
tar.workspace = true
futures = { workspace = true, features = ["executor"] }
getrandom.workspace = true
minisign-verify.workspace = true
reqwest = { workspace = true, features = ["json", "query", "stream"] }
rustls.workspace = true
# WHEP cameras (ADR-0064 W1, W2).
str0m.workspace = true
rust-embed = { workspace = true, optional = true }
gilrs = { workspace = true, optional = true }
gilrs-core = { workspace = true, optional = true }
fs4.workspace = true
sysinfo = { workspace = true, features = ["component", "disk"] }
extism = { workspace = true, optional = true }
wasmtime = { workspace = true, optional = true }
semver.workspace = true
dunce.workspace = true
sha2.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serialport.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tokio.workspace = true
tower-http.workspace = true
# The edge connection to the relay (S78): one outbound wss:// with the
# system's roots, as reqwest has.
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# Terminals on companion computers (ADR-0065): the daemon's pseudo-terminal,
# and `uxduck ssh`'s raw mode.
portable-pty.workspace = true
crossterm.workspace = true
# This computer's addresses, for "Phones and tablets on this network" (S97).
if-addrs = "0.15"
oxc = { version = "0.156", features = ["transformer", "codegen", "semantic"], optional = true }

# Keeping the system and display awake on Windows (SetThreadExecutionState).
# Pausing a simulation suspends its build's threads (Toolhelp, SuspendThread).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Power",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
] }
# Whether the connection is metered, for uploads (ADR-0046 B12).
windows = { version = "0.62", features = ["Networking_Connectivity"] }

# Pausing a simulation stops its build (SIGSTOP, SIGCONT); on macOS also
# atomic app replacement on the same volume, without a privileged helper.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

# Whether BlueZ still links a Bluetooth gamepad (Linux, FB-88): it can leave
# the input node behind. The version the tray uses.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6", default-features = false, features = ["default-rt", "proxy"] }
# An onboard computer's clock, read (adjtimex) and set (clock_settime) from
# the ground station's when nothing keeps it (S373).
libc = "0.2"
rustix = { version = "1.1", features = ["fs", "process", "time"] }

# Every input of a joystick and its value when it connects (macOS): gilrs
# reports an input only once it changes. The crates and versions gilrs uses.
[target.'cfg(target_os = "macos")'.dependencies]
# The Network framework's path monitor, for metered connections (ADR-0046 B12).
block2 = "0.6"
# posix_spawn, to start the daemon responsible for itself (responsibility.rs).
libc = "0.2"
# The wake lock as a latency-critical activity, so macOS neither naps the
# daemon nor coalesces its timers while a vehicle is connected, and whether
# Low Power Mode is on (FB-254), read in an autorelease pool. The versions
# the tray uses.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSProcessInfo",
  "NSString",
] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "libc",
  "hid",
], optional = true }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFArray",
  "CFDictionary",
  "CFNumber",
  "CFString",
  "CFSet",
  "CFRunLoop",
], optional = true }

[features]
default = ["gamepad", "plugins"]
# Build the web app into the executable (release builds). Needs `apps/web/dist`.
embed-ui = ["dep:rust-embed", "desktop-tray"]
# The UXDuck desktop product requires and supervises its separate tray helper.
# Core and custom clients run independently by default.
desktop-tray = []
# Controllers through the platform's gamepad support (gilrs). Without it,
# only `--fake-controller` exists: for headless builds with no libudev.
gamepad = ["dep:gilrs", "dep:gilrs-core", "dep:objc2-io-kit", "dep:objc2-core-foundation"]
# The WebAssembly plugin host (Extism and wasmtime). Without it, plugins
# cannot be installed.
plugins = ["dep:extism", "dep:wasmtime", "dep:oxc"]

[dev-dependencies]
minisign.workspace = true
# A certificate for the WHEP tests' MediaMTX (S383).
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
semver.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2"
mach2 = "0.6"

[build-dependencies]
cc = "1"
embed-resource = "3.0.12"

[lints]
workspace = true

# `cargo deb --target <triple> --no-build` after a release build (S8).
[package.metadata.deb]
name = "uxduck"
maintainer = "UXDuck <hello@uxduck.com>"
copyright = "UXDuck"
extended-description = "Ground control for MAVLink vehicles. This package installs the UXDuck desktop app, the daemon that runs links, vehicles, recording and forwarding, and the `uxduck` command line. Open UXDuck from your applications menu or run `uxduck open`. To run it without a window, use `systemctl --user enable --now uxduck`."
section = "net"
priority = "optional"
maintainer-scripts = "../../packaging/linux/maintainer-scripts"
# Electron runtime dependencies, alongside the native daemon's detected libraries.
depends = "$auto, libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0, libgbm1, libasound2"
# The tray icon (S64) needs an app indicator; UXDuck runs without one.
recommends = "libayatana-appindicator3-1"
assets = [
  [
    "target/release/uxduck",
    "usr/bin/",
    "755",
  ],
  [
    "target/release/uxduck-tray",
    "usr/bin/",
    "755",
  ],
  [
    "../../packaging/linux/uxduck.service",
    "usr/lib/systemd/user/",
    "644",
  ],
]

[[bin]]
name = "uxduck"
path = "src/main.rs"
