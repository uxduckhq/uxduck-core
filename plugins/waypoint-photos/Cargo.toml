[package]
license = "Apache-2.0"
name = "waypoint-photos"
description = "An automation: a photo at every waypoint a vehicle reaches, taken with UXDuck's own camera command (ADR-0006, ADR-0063 Y12)."
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
uxduck-sdk = { path = "../../crates/uxduck-sdk" }
serde_json = "1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
