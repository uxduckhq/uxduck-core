# First-party plugins, built for WebAssembly. README.md says how to build
# and install them.
[workspace]
resolver = "3"
members = ["camera-manager", "home-distance", "script-host"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# The SDK's MAVLink codegen; see vendor/mavinspect/README.md.
[patch.crates-io]
mavinspect = { path = "../vendor/mavinspect" }
