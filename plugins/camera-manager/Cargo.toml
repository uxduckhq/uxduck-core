[package]
license = "Apache-2.0"
name = "camera-manager"
description = "Drives a vehicle's camera through the MAVLink camera protocol: photos, video, zoom (ADR-0006)."
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
uxduck-sdk = { path = "../../crates/uxduck-sdk" }
serde_json = "1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
